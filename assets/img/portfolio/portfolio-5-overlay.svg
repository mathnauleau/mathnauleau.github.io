<title id="t">Isometric island scene</title><desc id="d">A lighthouse tile, a farm tile, a village tile and a figure-8 tile floating on a tiled sea, with a sun in the corner.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="5" x2="0" y2="402" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#7779f1"/><stop offset=".62" stop-color="#447bdc"/><stop offset="1" stop-color="#287cd1"/>
</linearGradient>
<linearGradient id="seafill" x1="0" y1="220" x2="0" y2="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f69cb"/><stop offset="1" stop-color="#216bc4"/></linearGradient>
<filter id="soft" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation=".7"/></filter>
<linearGradient id="sunfill" x1="1" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffcf66"/><stop offset="1" stop-color="#ffb552"/>
</linearGradient>
<linearGradient id="beamL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-88" y2="0">
  <stop offset="0" stop-color="#fffbd0" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
</linearGradient>
<linearGradient id="beamR" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="0">
  <stop offset="0" stop-color="#fffbd0" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
</linearGradient>
<linearGradient id="towerL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#d6cdcc"/><stop offset=".55" stop-color="#e4dddb"/><stop offset="1" stop-color="#f1ece9"/>
</linearGradient>
<pattern id="dotsLight" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#b8926e" fill-opacity=".55"/></pattern>
<pattern id="dotsDark" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#7d5f45" fill-opacity=".5"/></pattern>
<pattern id="dotsGrass" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r=".6" fill="#6f8f4a" fill-opacity=".7"/></pattern>
<pattern id="dotsSand" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r=".6" fill="#a07a52" fill-opacity=".6"/></pattern>
<clipPath id="card"><rect x="5" y="5" width="636" height="397" rx="14"/></clipPath>
<style>
  .sun-halo{animation:halo 5s ease-in-out infinite}
  .sun-halo2{animation:halo 5s ease-in-out -1.6s infinite}
  .beam{animation:sweep 8s ease-in-out infinite}
  .lamp{animation:lamp 8s ease-in-out infinite}
  .foam{animation:foam 5s ease-in-out infinite}
  .glint{transform-box:fill-box;transform-origin:center;opacity:0;animation:glint var(--d,4s) ease-in-out var(--s,0s) infinite}
  .tide{animation:tide 6s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.24);opacity:.1}}
  @keyframes sweep{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
  @keyframes lamp{0%,50%,100%{opacity:1}25%,75%{opacity:.55}}
  @keyframes foam{0%,100%{opacity:.5;transform:translate(0,0)}50%{opacity:1;transform:translate(var(--fx,0px),1.6px)}}
  @keyframes glint{0%,100%{opacity:0;transform:scaleX(.3)}50%{opacity:.55;transform:scaleX(1)}}
  @keyframes tide{0%,100%{opacity:1}50%{opacity:.78}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.glint{opacity:.35}}
</style>
</defs>
