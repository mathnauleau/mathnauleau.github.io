                  </linearGradient>
                  <linearGradient id="nrg-area" x1="0" y1="240" x2="0" y2="340" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#E5384A" stop-opacity="0.28" />
                    <stop offset="1" stop-color="#E5384A" stop-opacity="0" />
                  </linearGradient>
                  <clipPath id="nrg-screen-clip">
                    <rect x="15" y="15" width="270" height="560" rx="42" />
                  </clipPath>
                </defs>

                <rect width="800" height="500" fill="url(#nrg-bg)" />
                <rect width="800" height="500" fill="url(#nrg-glow)" />


                <!-- The app -->
