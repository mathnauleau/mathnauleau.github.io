                    <stop stop-color="#FDDB94" />
                    <stop offset="0.4" stop-color="#F7836C" />
                    <stop offset="0.72" stop-color="#D2468C" />
                    <stop offset="1" stop-color="#7044D4" />
                  </linearGradient>
                  <radialGradient id="nrg-glow" cx="400" cy="260" r="300" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#FFE3D6" stop-opacity="0.5" />
                    <stop offset="1" stop-color="#FFE3D6" stop-opacity="0" />
                  </radialGradient>
                  <linearGradient id="nrg-screen" x1="0" y1="15" x2="0" y2="560" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#C6EFF3" />
                    <stop offset="0.35" stop-color="#E4F5F2" />
                    <stop offset="0.7" stop-color="#F8E8DF" />
