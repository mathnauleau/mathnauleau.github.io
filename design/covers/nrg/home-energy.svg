                      <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1F2430">
                        <text x="44" y="177" font-size="12.5" fill="#5B6170">Usage this week</text>
                        <text x="44" y="205" font-size="24" font-weight="800">132 kWh</text>
                        <rect x="152" y="187" width="50" height="22" rx="11" fill="#DDF3E7" />
                        <text x="177" y="202" font-size="11.5" font-weight="700" fill="#178856"
                          text-anchor="middle">−12%</text>
                      </g>
                      <g stroke="#1F2430" stroke-opacity="0.08" stroke-dasharray="3 4">
                        <path d="M44 242H256" />
                        <path d="M44 284H256" />
                        <path d="M44 326H256" />
                      </g>
                      <path d="M44 340H256" stroke="#1F2430" stroke-opacity="0.15" />
                      <!-- Estimate (dashed) and actual usage, which draws itself -->
                      <path
                        d="M44.0 249.0C49.9 250.2 67.6 256.0 79.3 256.0C91.1 256.0 102.9 249.0 114.7 249.0C126.4 249.0 138.2 254.8 150.0 256.0C161.8 257.2 173.6 254.8 185.3 256.0C197.1 257.2 208.9 263.0 220.7 263.0C232.4 263.0 250.1 257.2 256.0 256.0"
                        stroke="#9AA0AB" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" />
                      <path class="area"
                        d="M44.0 256.0C49.9 260.7 67.6 286.3 79.3 284.0C91.1 281.7 102.9 239.7 114.7 242.0C126.4 244.3 138.2 293.3 150.0 298.0C161.8 302.7 173.6 267.7 185.3 270.0C197.1 272.3 208.9 309.7 220.7 312.0C232.4 314.3 250.1 288.7 256.0 284.0L256 340H44Z"
                        fill="url(#nrg-area)" />
                      <path class="line"
                        d="M44.0 256.0C49.9 260.7 67.6 286.3 79.3 284.0C91.1 281.7 102.9 239.7 114.7 242.0C126.4 244.3 138.2 293.3 150.0 298.0C161.8 302.7 173.6 267.7 185.3 270.0C197.1 272.3 208.9 309.7 220.7 312.0C232.4 314.3 250.1 288.7 256.0 284.0"
                        pathLength="1" stroke="#E5384A" stroke-width="3.2" stroke-linecap="round"
