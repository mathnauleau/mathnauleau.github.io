<!-- Home energy app cover, exported from index.html by design/covers/export.py.
     Open it in a browser to see it animate; the styles are assets/css/covers/base.css
     and assets/css/covers/nrg.css. Edit the page, then re-run the script. -->
<svg xmlns="http://www.w3.org/2000/svg" class="nrg" width="800" height="500" viewBox="0 0 800 500" fill="none" role="img" aria-label="Home energy app">
  <style><![CDATA[
/* Shared rules for the animated project covers (inline <svg> in .portfolio-wrap).
   The values below are the motion tokens from design/covers/SPEC.md; each cover's own
   stylesheet (assets/css/covers/<prefix>.css) should use them instead of its own numbers.
   Load this file before the cover stylesheets. */

:root {
  /* Loops */
  --cover-story: 12s;      /* a cover that tells its project's story, in beats of ~3s */
  --cover-ambient: 7s;     /* background life: floats, drifts, glows */

  /* Easing */
  --cover-ease: cubic-bezier(0.4, 0, 0.2, 1);       /* default for everything */
  --cover-ease-pop: cubic-bezier(0.3, 0.8, 0.3, 1.1); /* at most one small "pop" per cover */

  /* Hover: the hero element lifts */
  --cover-hover-lift: -6px;
  --cover-hover-duration: 300ms;

  /* Ambient movement stays small */
  --cover-ambient-amplitude: 8px;
}

/* Off screen (or tab hidden), js/covers.js adds .is-paused to the cover's <svg>: every
   CSS animation inside it freezes where it is and resumes from there. SMIL animations
   are paused by the script itself (svg.pauseAnimations()). */
.portfolio-wrap > svg.is-paused,
.portfolio-wrap > svg.is-paused * {
  animation-play-state: paused !important;
}

/* Home energy app cover (inline <svg class="nrg"> in #project16, index.html).
   Calm by design: the app alone in the middle of its gradient.
   On the screen (12s loop, CSS): the week's usage line draws itself against the dashed
   estimate; as the "New reading" notification slides in (~36%), the line reaches today,
   the dot and its tooltip appear and the stat bars fill; then it all resets.
   Every rule sits in @scope (.nrg); keyframes and SVG IDs use the nrg- prefix.
   Without motion the notification is hidden and the chart shows complete. */

/* The tile behind the SVG: shows until the SVG is parsed. */
#project16 {
  background: linear-gradient(32deg, #FDDB94 0%, #F7836C 40%, #D2468C 72%, #7044D4 100%);
}

/* As a tall tile: the space under the art continues the drawing's bottom edge */
.portfolio-item--tall #project16 {
  background: linear-gradient(90deg, #F9A07D 0%, #D2468C 60%, #7044D4 100%);
}

.portfolio-item--tall #project16 .portfolio-title h4,
.portfolio-item--tall #project16 .portfolio-title p {
  color: #fff;
}

@scope (.nrg) {
  :scope {
    --cyc: 12s;
    display: block;
    width: 100%;
    height: auto;
  }

  .notif { animation: nrg-notif var(--cyc) cubic-bezier(0.4, 0, 0.2, 1) infinite; }

  /* Chart */
  .line {
    stroke-dasharray: 1 1;
    animation: nrg-line var(--cyc) ease-in-out infinite;
  }
  .area { animation: nrg-area var(--cyc) ease-in-out infinite; }
  .dot, .tip, .halo {
    transform-box: fill-box;
    transform-origin: center;
  }
  .dot { animation: nrg-dot var(--cyc) ease-out infinite; }
  .halo { animation: nrg-halo var(--cyc) ease-out infinite; }
  .tip {
    transform-origin: 80% 100%;
    animation: nrg-tip var(--cyc) cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .prog {
    transform-box: fill-box;
    transform-origin: left;
    animation: nrg-prog var(--cyc) cubic-bezier(0.3, 0.8, 0.3, 1) infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
    .notif, .halo { display: none; }
  }
}

/* Slides down from the island, holds, slides back up */
@keyframes nrg-notif {
  0%, 30% { opacity: 0; transform: translateY(-60px); }
  37%, 60% { opacity: 1; transform: translateY(0); }
  67%, 100% { opacity: 0; transform: translateY(-60px); }
}

/* Draws up to yesterday, waits, adds today with the reading, fades for the next take */
@keyframes nrg-line {
  0% { stroke-dashoffset: 1; opacity: 1; }
  26%, 34% { stroke-dashoffset: 0.17; }
  42%, 90% { stroke-dashoffset: 0; opacity: 1; }
  97% { stroke-dashoffset: 0; opacity: 0; }
  100% { stroke-dashoffset: 1; opacity: 0; }
}

@keyframes nrg-area {
  0%, 40% { opacity: 0; }
  50%, 90% { opacity: 1; }
  97%, 100% { opacity: 0; }
}

@keyframes nrg-dot {
  0%, 40% { transform: scale(0); }
  46%, 90% { transform: scale(1); }
  96%, 100% { transform: scale(0); }
}

@keyframes nrg-halo {
  0%, 44% { opacity: 0; transform: scale(1); }
  46% { opacity: 0.5; transform: scale(1); }
  64%, 100% { opacity: 0; transform: scale(3.4); }
}

@keyframes nrg-tip {
  0%, 44% { opacity: 0; transform: translateY(4px); }
  50%, 86% { opacity: 1; transform: translateY(0); }
  92%, 100% { opacity: 0; transform: translateY(4px); }
}

@keyframes nrg-prog {
  0%, 38% { transform: scaleX(0.15); }
  54%, 92% { transform: scaleX(1); }
  100% { transform: scaleX(0.15); }
}
]]></style>
                <defs>
