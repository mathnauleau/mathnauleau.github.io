                      <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1F2430">
                        <text x="40" y="410" font-size="10.5" fill="#5B6170">Total vs estimated</text>
                        <text x="40" y="436" font-size="20" font-weight="800">95%</text>
