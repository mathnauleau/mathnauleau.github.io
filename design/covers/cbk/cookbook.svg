                <!-- Editor -->
                <rect x="44" y="66" width="376" height="392" rx="22" fill="#0F3D3A" opacity=".22"
                  filter="url(#cbk-shadow)" />
                <rect x="40" y="52" width="380" height="396" rx="22" fill="#0F3D3A" />
                <path d="M40 74C40 61.85 49.85 52 62 52H398C410.15 52 420 61.85 420 74V98H40Z" fill="#0B3331" />
                <circle cx="66" cy="75" r="5.5" fill="#E0745E" />
                <circle cx="84" cy="75" r="5.5" fill="#F4B13B" />
                <circle cx="102" cy="75" r="5.5" fill="#F2E6D6" fill-opacity=".35" />
                <text x="230" y="80" text-anchor="middle"
