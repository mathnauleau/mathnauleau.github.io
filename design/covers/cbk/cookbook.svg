                </defs>
                <rect width="800" height="500" fill="url(#cbk-bg)" />
                <!-- Drifting leaves, after the Commeat logo -->
                <g class="drift" style="--s:0s">
                  <use href="#cbk-leaf-shape" transform="translate(30 462) rotate(-35) scale(2.2)" fill="url(#cbk-leaf)"
                    opacity=".55" />
