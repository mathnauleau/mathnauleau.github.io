                <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2E6D6"
                  fill-opacity=".25" text-anchor="end">
                  <text x="74" y="136">1</text><text x="74" y="166">2</text><text x="74" y="196">3</text><text x="74"
                    y="226">4</text><text x="74" y="256">5</text>
                  <text x="74" y="286">6</text><text x="74" y="316">7</text><text x="74" y="346">8</text><text x="74"
                    y="376">9</text><text x="74" y="406">10</text>
                </g>
                <!-- Editor lines stay one per line: whitespace between <tspan>s renders as a space.
                     textLength pins each line to 9.6 units per character so covers and caret match. -->
                <!-- prettier-ignore -->
                <g class="ed-text" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16"
                  fill="#F2E6D6">
                  <text x="92" y="136" textLength="124.8">
                    <tspan fill="#F4B13B"># </tspan>
                    <tspan font-weight="700">Tarte Tatin</tspan>
                  </text>
