<!-- DesignOps cover, exported from index.html by design/covers/export.py.
     Open it in a browser to see it animate; the styles are assets/css/covers/base.css
     and assets/css/covers/ops.css. Edit the page, then re-run the script. -->
<svg xmlns="http://www.w3.org/2000/svg" class="ops" width="800" height="500" viewBox="0 0 800 500" fill="none" role="img" aria-label="DesignOps">
  <style><![CDATA[
/* Shared rules for the animated project covers (inline <svg> in .portfolio-wrap).
   The values below are the motion tokens from design/covers/SPEC.md; each cover's own
   stylesheet (assets/css/covers/<prefix>.css) should use them instead of its own numbers.
   Load this file before the cover stylesheets. */

:root {
  /* Loops */
  --cover-story: 12s;      /* a cover that tells its project's story, in beats of ~3s */
  --cover-ambient: 7s;     /* background life: floats, drifts, glows */

  /* Easing */
  --cover-ease: cubic-bezier(0.4, 0, 0.2, 1);       /* default for everything */
  --cover-ease-pop: cubic-bezier(0.3, 0.8, 0.3, 1.1); /* at most one small "pop" per cover */

  /* Hover: the hero element lifts */
  --cover-hover-lift: -6px;
  --cover-hover-duration: 300ms;

  /* Ambient movement stays small */
  --cover-ambient-amplitude: 8px;
}

/* Off screen (or tab hidden), js/covers.js adds .is-paused to the cover's <svg>: every
   CSS animation inside it freezes where it is and resumes from there. SMIL animations
   are paused by the script itself (svg.pauseAnimations()). */
.portfolio-wrap > svg.is-paused,
.portfolio-wrap > svg.is-paused * {
  animation-play-state: paused !important;
}

/* DesignOps cover (inline <svg class="ops"> in #project10, index.html).
   Every rule for the drawing sits in @scope (.ops), so it can't reach the rest of the
   page. Keyframes are always page-wide, hence the ops- prefix; IDs inside the SVG use
   the same prefix. Light dashes run along the lines (each line takes 4 × the ambient
   loop, starts spaced 7s apart) and the stations pulse in a wave (ambient loop); the
   toggle knob switches on when the pill itself is hovered, with a real pointer above
   768px. Timing and easing come from assets/css/covers/base.css (design/covers/SPEC.md).
   Animations stop for prefers-reduced-motion. */

/* The tile behind the SVG: shows until the SVG is parsed. */
#project10 {
  background: linear-gradient(32deg, #FFABC1 0%, #FF584E 100%);
}

/* As a tall tile: the space under the art continues the drawing's bottom edge */
.portfolio-item--tall #project10 {
  background: linear-gradient(90deg, #E5566A 0%, #FF584E 100%);
}

.portfolio-item--tall #project10 .portfolio-title h4 {
  color: #fff;
}

.portfolio-item--tall #project10 .portfolio-title p {
  color: #fff;
}

@scope (.ops) {
  :scope {
    display: block;
    width: 100%;
    height: auto;
  }

  .train {
    stroke-dasharray: 4 96;
    stroke-dashoffset: 100;
    opacity: 0.7;
    animation: ops-train calc(var(--cover-ambient) * 4) linear var(--s, 0s) infinite;
  }

  .stop {
    transform-box: fill-box;
    transform-origin: center;
    animation: ops-stop var(--cover-ambient) var(--cover-ease) var(--s, 0s) infinite;
  }

  .knob {
    transform: translateX(-48px);
    transition: transform var(--cover-hover-duration) var(--cover-ease);
  }

  @media (hover: hover) and (min-width: 769px) {
    .toggle:hover .knob {
      transform: translateX(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }

    .train {
      display: none;
    }
  }
}

@keyframes ops-train {
  to { stroke-dashoffset: 0; }
}

@keyframes ops-stop {
  0%, 70%, 100% { transform: scale(1); }
  80% { transform: scale(1.25); }
}
]]></style>
